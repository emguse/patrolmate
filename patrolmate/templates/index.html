<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PatrolMate</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: #0f172a;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .card {
        width: min(960px, 100%);
        background: rgba(15, 23, 42, 0.85);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      form {
        display: grid;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-weight: 600;
      }

      input,
      textarea {
        padding: 0.75rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.4);
        color: inherit;
        resize: vertical;
        font: inherit;
      }

      input:focus,
      textarea:focus {
        outline: 2px solid rgba(94, 234, 212, 0.5);
        border-color: rgba(94, 234, 212, 0.5);
      }

      button {
        justify-self: start;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #22d3ee, #a855f7);
        color: #0f172a;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(56, 189, 248, 0.35);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      .status {
        min-height: 1.5rem;
        font-size: 0.95rem;
        color: #fca5a5;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
      }

      .log-entry {
        padding: 1.5rem;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.45);
      }

      .log-entry h2 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
      }

      .log-entry time {
        display: block;
        font-size: 0.9rem;
        color: rgba(148, 163, 184, 0.8);
        margin-bottom: 0.75rem;
      }

      .empty-state {
        padding: 2rem;
        border: 1px dashed rgba(148, 163, 184, 0.3);
        border-radius: 18px;
        text-align: center;
        color: rgba(148, 163, 184, 0.9);
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }

        .card {
          padding: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>巡回ログ</h1>
      <p>最新の巡回記録を共有し、チーム全体で状況を把握しましょう。</p>

      <form id="log-form" autocomplete="off">
        <label>
          タイトル
          <input type="text" name="title" required maxlength="120" />
        </label>
        <label>
          メモ
          <textarea name="notes" rows="4" placeholder="必要に応じて詳細を入力してください"></textarea>
        </label>
        <button type="submit">ログを追加</button>
        <div class="status" aria-live="polite"></div>
      </form>

      <section>
        <h2>履歴</h2>
        <div id="logs" class="empty-state">読み込み中...</div>
      </section>
    </div>

    <template id="log-template">
      <article class="log-entry">
        <h2></h2>
        <time></time>
        <p></p>
      </article>
    </template>

    <script>
      let logsContainer = document.getElementById("logs");
      const logTemplate = document.getElementById("log-template");
      const statusEl = document.querySelector(".status");
      const form = document.getElementById("log-form");
      const submitButton = form.querySelector("button");

      function replaceLogs(nextNode) {
        logsContainer.replaceWith(nextNode);
        logsContainer = nextNode;
      }

      function formatDate(isoString) {
        const date = new Date(isoString);
        return new Intl.DateTimeFormat("ja-JP", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(date);
      }

      function showEmptyState(message) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = message;
        empty.id = "logs";
        replaceLogs(empty);
      }

      async function loadLogs() {
        try {
          const response = await fetch("/api/logs");
          if (!response.ok) {
            throw new Error("ログの取得に失敗しました");
          }
          const logs = await response.json();
          renderLogs(logs);
        } catch (error) {
          showEmptyState(error.message);
        }
      }

      function renderLogs(logs) {
        if (!Array.isArray(logs) || logs.length === 0) {
          showEmptyState("まだ巡回ログはありません");
          return;
        }

        const list = document.createElement("ul");
        list.id = "logs";

        logs.forEach((log) => {
          const node = logTemplate.content.firstElementChild.cloneNode(true);
          node.querySelector("h2").textContent = log.title;
          node.querySelector("time").textContent = formatDate(log.created_at);
          node.querySelector("p").textContent = log.notes || "メモはありません";
          list.appendChild(node);
        });

        replaceLogs(list);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusEl.textContent = "送信中...";
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());
        const title = (payload.title || "").trim();
        const notes = (payload.notes || "").trim();

        if (!title) {
          statusEl.textContent = "タイトルを入力してください";
          return;
        }

        submitButton.disabled = true;

        try {
          const response = await fetch("/api/logs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title,
              notes: notes || null,
            }),
          });

          if (!response.ok) {
            let message = "保存に失敗しました";
            try {
              const body = await response.json();
              if (body && body.error) {
                message = body.error;
              }
            } catch (jsonError) {
              console.error(jsonError);
            }
            throw new Error(message);
          }

          form.reset();
          statusEl.textContent = "保存しました";
          setTimeout(() => {
            statusEl.textContent = "";
          }, 2000);
          await loadLogs();
        } catch (error) {
          statusEl.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      loadLogs();
    </script>
  </body>
</html>
